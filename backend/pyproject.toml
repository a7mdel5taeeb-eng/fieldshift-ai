[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldshift-ai-backend"
version = "0.1.0"
description = "FieldShift AI technical foundation API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "h5py>=3.12,<4.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.8,<1.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["F", "I"]
